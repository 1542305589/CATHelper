<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATHelper 中心节点控制台</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --border:#e2e4e8; --text:#1f2328; --muted:#6b7280; --primary:#2563eb;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --mono:Consolas,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  .refresh { margin-left:auto; color:var(--muted); font-size:12px; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px 20px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; }
  .card > h2 { font-size:13px; margin:0; padding:10px 14px; border-bottom:1px solid var(--border); font-weight:600; }
  .body { padding:12px 14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
  .badge.healthy { background:var(--green); }
  .badge.unmatched { background:var(--amber); }
  .badge.other { background:#9333ea; }
  .badge.report_failed { background:#eab308; }
  .badge.disconnected { background:var(--red); }
  button { border:1px solid var(--border); background:var(--card); padding:5px 11px; border-radius:7px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--primary); color:var(--primary); }
  button.danger { color:var(--red); }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  input { border:1px solid var(--border); border-radius:7px; padding:5px 9px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mt { margin-top:10px; }
  .muted { color:var(--muted); font-size:12px; }
  .console-link { color:var(--primary); text-decoration:none; font-size:12px; }
  .console-link:hover { text-decoration:underline; }
  .daemon-link { color:var(--primary); text-decoration:none; }
  .daemon-link:hover { text-decoration:underline; }
  .biz-head { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; }
  .biz-head .name { font-weight:600; }
  .del-row { margin-left:auto; }
  .modal { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal.open { display:flex; }
  .modal-card { width:min(760px,94vw); max-height:88vh; overflow:auto; }
  .kpi-node { border-top:1px solid var(--border); padding:12px 14px; }
  .kpi-node:first-child { border-top:0; }
  .dev-grid { display:flex; flex-wrap:wrap; gap:8px 14px; margin:8px 0; }
  .dev-grid label { font-size:13px; display:flex; align-items:center; gap:4px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:999px; background:#eef2ff; color:var(--primary); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>慢节点检测 · 中心节点</h1>
  <span class="refresh">每 5s 自动刷新</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>添加业务</h2>
    <div class="body">
      <div class="row">
        <input id="bizName" placeholder="业务名称">
        <input id="bizInterval" type="number" min="60" placeholder="Profiler 周期(秒)" style="width:150px">
        <input id="bizKPIInterval" type="number" min="5" max="86400" placeholder="KPI 检测周期(秒)" style="width:160px">
        <input id="bizDaemons" placeholder="守护进程 ip:port（逗号分隔多个）" style="width:360px">
        <button class="primary" onclick="addBusiness()">添加</button>
      </div>
      <div class="muted mt">Profiler 周期和 KPI 检测周期都按业务设置；KPI 检测周期默认 10s。</div>
      <div class="muted mt">守护进程格式：192.168.1.10:8080,192.168.1.11:8080</div>
    </div>
  </div>

  <div id="list"></div>
</div>

<div id="kpiModal" class="modal">
  <div class="card modal-card">
    <div class="biz-head" style="cursor:default">
      <span class="name" id="kpiTitle">KPI device 过滤</span>
      <span class="muted" id="kpiHint"></span>
      <span class="del-row"><button onclick="closeKPIFilter()">关闭</button></span>
    </div>
    <div class="body" id="kpiBody"></div>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:all .2s;"></div>

<script>
const $ = id => document.getElementById(id);
let selectedBiz = null;

function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escJS(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '\\r').replace(/\n/g, '\\n'); }

function toast(msg, ok) {
  const t = $('toast');
  t.textContent = msg;
  t.style.opacity = 1;
  t.style.background = ok ? '#16a34a' : '#dc2626';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.opacity = 0, 2500);
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  const txt = await r.text().catch(()=> '');
  let d = {}; try { d = txt ? JSON.parse(txt) : {}; } catch(e){}
  if (!r.ok) throw new Error(r.status + (txt ? ' ' + txt : ''));
  return d;
}
async function del(url) {
  const r = await fetch(url, { method:'DELETE' });
  if (!r.ok) throw new Error(r.status);
}

function daemonRow(biz, d) {
  return `<tr>
    <td><a class="daemon-link" href="http://${d.ip}:${d.port}/" target="_blank">${d.ip}:${d.port}</a></td>
    <td><span class="badge ${d.state}">${stateLabel(d.state)}</span></td>
    <td>${d.collect_wait ? d.collect_wait + 's' : '—'}</td>
    <td>
      <button onclick="matchDaemon('${biz}','${d.ip}',${d.port})">匹配</button>
      <button onclick="unmatchDaemon('${biz}','${d.ip}',${d.port})">解除匹配</button>
      <button class="danger" onclick="removeDaemon('${biz}','${d.ip}',${d.port})">删除</button>
    </td>
  </tr>`;
}

function stateLabel(s) {
  return {healthy:'已匹配', unmatched:'未匹配', other:'已和其他中心匹配', report_failed:'上报失败', disconnected:'断连'}[s] || s;
}

function render(list) {
  // 收集展开状态 + 输入框值，刷新时保留（避免 5s 轮询把用户操作冲掉）
  const expanded = new Set();
  const inputVals = {};
  document.querySelectorAll('#list .biz-head').forEach(h => {
    const name = h.querySelector('.name').textContent;
    const body = h.nextElementSibling;
    if (body && body.style.display !== 'none') expanded.add(name);
  });
  document.querySelectorAll('#list input').forEach(i => { inputVals[i.id] = i.value; });
  // 记录当前焦点与光标位置，重建 DOM 后恢复，避免输入途中 5s 刷新打断输入
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const el = $('list');
  el.innerHTML = '';
  for (const b of list.businesses || []) {
    const allHealthy = b.daemons.length > 0 && b.daemons.every(d => d.state === 'healthy');
    const summary = `<span class="badge ${allHealthy ? 'healthy' : 'disconnected'}">${allHealthy ? '可触发' : '已冻结'}</span>`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="biz-head" onclick="toggleDetail(this)">
        <span class="name">${escAttr(b.name)}</span>
        <a class="console-link" href="/center/business/${encodeURIComponent(b.name)}/console" onclick="event.stopPropagation()">进入控制台</a>
        <span class="muted">周期 ${b.interval_sec}s · ${b.daemons.length} 守护进程</span>
        ${summary}
        <span class="del-row"><button class="danger" onclick="event.stopPropagation();removeBusiness('${escJS(b.name)}')">删除业务</button></span>
      </div>
      <div class="body" style="display:${expanded.has(b.name) ? '' : 'none'}">
        <table>
          <thead><tr><th>守护进程</th><th>状态</th><th>等待完成采集时间</th><th>操作</th></tr></thead>
          <tbody>${b.daemons.map(d => daemonRow(b.name, d)).join('')}</tbody>
        </table>
        <div class="row mt">
          <input id="dip-${escAttr(b.name)}" placeholder="ip" value="${escAttr(inputVals['dip-' + b.name] ?? '')}">
          <input id="dport-${escAttr(b.name)}" type="number" placeholder="port" style="width:90px" value="${escAttr(inputVals['dport-' + b.name] ?? '')}">
          <button onclick="addDaemon('${escJS(b.name)}')">添加守护进程</button>
          <button onclick="openKPIFilter('${escJS(b.name)}')">KPI device 过滤</button>
          <input id="vllm-${escAttr(b.name)}" placeholder="vllm /metrics URL" style="width:280px" value="${escAttr(inputVals['vllm-' + b.name] ?? (b.vllm_metrics || ''))}">
          <button onclick="setVllm('${escJS(b.name)}')">设置 vllm 接口</button>
          ${b.vllm_metrics ? `<button class="danger" onclick="unsetVllm('${escJS(b.name)}')">清除</button>` : ''}
        </div>
      </div>`;
    el.appendChild(card);
  }
  if (focusId) {
    const input = document.getElementById(focusId);
    if (input) {
      input.focus();
      if (selStart != null) {
        try { input.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function toggleDetail(head) {
  const body = head.nextElementSibling;
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

async function addBusiness() {
  const name = $('bizName').value.trim();
  const interval = parseInt($('bizInterval').value, 10) || 0;
  const kpiInterval = parseInt($('bizKPIInterval').value, 10) || 10;
  if (kpiInterval < 5 || kpiInterval > 86400) return toast('KPI 检测周期需在 [5, 86400] 秒之间', false);
  const daemons = ($('bizDaemons').value || '').split(',').map(s => s.trim()).filter(Boolean).map(s => {
    const [ip, port] = s.split(':');
    return { ip, port: parseInt(port, 10) };
  });
  if (!name) return toast('请填写业务名称', false);
  try {
    await post('/center/business', { name, interval_sec: interval, kpi_interval_sec: kpiInterval, daemons });
    toast('已添加业务 ' + name, true);
    $('bizName').value = ''; $('bizDaemons').value = '';
    refresh();
    openKPIFilter(name);
  } catch(e) { toast('添加失败：' + e.message, false); }
}

async function removeBusiness(name) {
  if (!confirm('删除业务 ' + name + '？将解除其所有守护进程匹配。')) return;
  try { await del('/center/business/' + encodeURIComponent(name)); toast('已删除', true); refresh(); }
  catch(e) { toast('删除失败：' + e.message, false); }
}

async function addDaemon(biz) {
  const ip = $('dip-' + biz).value.trim();
  const port = parseInt($('dport-' + biz).value, 10);
  if (!ip || !port) return toast('请填写 ip 和 port', false);
  try { await post('/center/business/' + encodeURIComponent(biz) + '/daemon', { ip, port }); toast('已添加守护进程', true); refresh(); }
  catch(e) { toast('添加失败：' + e.message, false); }
}

async function removeDaemon(biz, ip, port) {
  if (!confirm('删除守护进程 ' + ip + ':' + port + '？')) return;
  try { await del('/center/business/' + encodeURIComponent(biz) + '/daemon?ip=' + ip + '&port=' + port); toast('已删除', true); refresh(); }
  catch(e) { toast('删除失败：' + e.message, false); }
}

async function matchDaemon(biz, ip, port) {
  try { await post('/center/business/' + encodeURIComponent(biz) + '/daemon/match', { ip, port }); toast('已发送匹配', true); refresh(); }
  catch(e) { toast('匹配失败：' + e.message, false); }
}

async function unmatchDaemon(biz, ip, port) {
  try { await post('/center/business/' + encodeURIComponent(biz) + '/daemon/unmatch', { ip, port }); toast('已解除匹配', true); refresh(); }
  catch(e) { toast('解除失败：' + e.message, false); }
}

async function setVllm(biz) {
  const url = $('vllm-' + biz).value.trim();
  if (!url) return toast('请填写 vllm /metrics URL', false);
  try { await post('/center/business/' + encodeURIComponent(biz) + '/vllm', { url }); toast('已设置 vllm 接口', true); refresh(); }
  catch(e) { toast('设置失败：' + e.message, false); }
}

async function unsetVllm(biz) {
  $('vllm-' + biz).value = '';
  try { await del('/center/business/' + encodeURIComponent(biz) + '/vllm'); toast('已清除 vllm 接口', true); refresh(); }
  catch(e) { toast('清除失败：' + e.message, false); }
}

let kpiBiz = null;
let kpiKnown = [];
let kpiFilters = [];

function parseDevices(s) {
  return (s || '').split(',').map(x => parseInt(x.trim(), 10)).filter(n => Number.isInteger(n) && n >= 0);
}

function openKPIFilter(biz) {
  kpiBiz = biz;
  $('kpiTitle').textContent = 'KPI device 过滤 · ' + biz;
  $('kpiHint').textContent = '';
  $('kpiBody').innerHTML = '<div class="muted">加载中…</div>';
  $('kpiModal').classList.add('open');
  Promise.all([
    getJSON('/center/business/' + encodeURIComponent(biz) + '/kpi/devices').catch(() => ({ nodes: [] })),
    getJSON('/center/business/' + encodeURIComponent(biz) + '/kpi/filter').catch(() => ({ filters: [] })),
  ]).then(([dev, filt]) => {
    if (kpiBiz !== biz) return;
    kpiKnown = dev.nodes || [];
    kpiFilters = filt.filters || [];
    renderKPIFilterEditor();
  }).catch(e => {
    $('kpiBody').innerHTML = '<div class="muted">加载失败：' + escAttr(e.message) + '</div>';
  });
}

function closeKPIFilter() {
  $('kpiModal').classList.remove('open');
  kpiBiz = null;
}

function renderKPIFilterEditor() {
  const known = new Map(kpiKnown.map(n => [n.node, (n.devices || []).slice()]));
  for (const f of kpiFilters) if (!known.has(f.node)) known.set(f.node, []);
  const nodes = Array.from(known.keys()).sort();

  let html = '<div class="muted">默认勾选全部 device；全部不勾选=该节点全部 device 被过滤。可手动补充节点和 device。</div>';
  for (const node of nodes) {
    const all = known.get(node) || [];
    const current = kpiFilters.find(f => f.node === node);
    const selected = new Set(current && !current.filter_all ? current.devices : (current ? [] : all));
    const extra = current && !current.filter_all ? current.devices.filter(d => !all.includes(d)) : [];
    html += `<div class="kpi-node" data-node="${escAttr(node)}">
      <div><b>${escAttr(node)}</b> ${all.length ? `<span class="tag">最新数据 ${all.length} devices</span>` : `<span class="tag">无最新 KPI 数据</span>`}</div>
      ${all.length ? `<div class="dev-grid">${all.map(d => `<label><input type="checkbox" class="kpi-dev" value="${d}" ${selected.has(d) ? 'checked' : ''}>device ${d}</label>`).join('')}</div>` : ''}
      <div class="row">
        ${all.length ? `<button onclick="selectAllKPIDevices(this, true)">全选</button><button onclick="selectAllKPIDevices(this, false)">全不选</button>` : ''}
        <input class="kpi-manual" placeholder="额外 device，如 3,5" value="${escAttr(extra.join(','))}" style="width:180px">
        <button onclick="saveKPIFilter('${escJS(node)}', this)">保存该节点过滤</button>
        <button class="danger" onclick="clearKPIFilter('${escJS(node)}')">清除该节点过滤</button>
      </div>
    </div>`;
  }
  html += `<div class="kpi-node">
    <div><b>手动添加节点</b></div>
    <div class="row mt">
      <input id="kpiNewNode" placeholder="节点名，如 node-a" style="width:200px">
      <input id="kpiNewDevices" placeholder="device，如 0,1,2" style="width:200px">
      <button onclick="saveManualKPIFilter()">保存</button>
    </div>
  </div>`;
  $('kpiBody').innerHTML = html;
  $('kpiHint').textContent = nodes.length ? '' : '暂无最新 KPI 数据，只能手动输入';
}

async function postKPIFilter(biz, node, devices, filterAll) {
  try {
    await post('/center/business/' + encodeURIComponent(biz) + '/kpi/filter', { node, devices, filter_all: !!filterAll });
    toast(filterAll ? ('已过滤全部 device：' + node) : ('已保存 KPI 过滤：' + node), true);
    openKPIFilter(biz);
  } catch(e) {
    toast('保存失败：' + e.message, false);
  }
}

function selectAllKPIDevices(btn, checked) {
  const box = btn.closest('.kpi-node');
  box.querySelectorAll('.kpi-dev').forEach(x => { x.checked = checked; });
}

async function saveKPIFilter(node, btn) {
  if (!kpiBiz) return;
  const box = btn.closest('.kpi-node');
  const boxes = Array.from(box.querySelectorAll('.kpi-dev'));
  const checked = boxes.filter(x => x.checked).map(x => parseInt(x.value, 10));
  const manual = parseDevices(box.querySelector('.kpi-manual')?.value);
  const devices = checked.slice();
  for (const d of manual) if (!devices.includes(d)) devices.push(d);

  if (boxes.length > 0 && checked.length === 0 && manual.length === 0) {
    await postKPIFilter(kpiBiz, node, [], true);
    return;
  }
  if (boxes.length > 0 && checked.length === boxes.length && manual.length === 0) {
    await postKPIFilter(kpiBiz, node, [], false);
    return;
  }
  await postKPIFilter(kpiBiz, node, devices, false);
}

async function clearKPIFilter(node) {
  if (!kpiBiz) return;
  await postKPIFilter(kpiBiz, node, [], false);
}

async function saveManualKPIFilter() {
  if (!kpiBiz) return;
  const node = $('kpiNewNode').value.trim();
  if (!node) return toast('请填写节点名', false);
  const devices = parseDevices($('kpiNewDevices').value);
  await postKPIFilter(kpiBiz, node, devices, false);
}

async function refresh() {
  try {
    const data = await getJSON('/center/businesses');
    render(data);
  } catch(e) { /* center may be restarting */ }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
