[pytest]
asyncio_mode = auto
markers =
    P0: priority P0
    P1: priority P1
    P2: priority P2
    lightweight: lightweight tier (PR-triggered)
    full: full tier
    nightly: nightly tier
    inject: requires sidecar injection
    fail_fast: expects service startup failure
addopts = -ra --strict-markers
testpaths = tests
