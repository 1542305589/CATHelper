# E2E Test Cases Registry
# Maps functional test names to TC IDs, priorities, tiers, and execution order.
# Tiers: lightweight (P0, PR), full (P0+P1+P2 except nightly), nightly (all)
# TC 编号与 E2E测试用例.xlsx 保持一致（连续 TC-001~TC-042）
# order 按服务签名分组连片排布（vllm_service_factory 单活跃实例）：
#   10        no-mw 服务（采集基线）
#   20~45     默认服务组 {middleware: on, env: {}, injector: on}
#   60~66     自定义 env 组（各独立签名）
#   70~72     DETECTOR_WORKERS=4 组（nightly）
#   80        latency（函数内串行换出 no-mw -> mw）
#   90~92     fail-fast 组（expect_fail，不占活跃槽位）

# === P0 (lightweight + full + nightly) ===
